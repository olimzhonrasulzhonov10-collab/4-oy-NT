<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Svetofor</title>
    <style>
        .svetofor{
            width: 120px;
            border-radius: 20px;
            background-color: black;
            display: flex;
            align-items: center;
            height: 300px;
            flex-direction: column;

        }
        .chiroq{
            box-sizing: border-box;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 15px;
        }
        .qizil{background-color: red;
        }
        .sariq{background-color: yellow;
        }
        .yashil{background-color: green;
        }
    </style>
</head>
<body>
    <div class="svetofor">
        <div class=" chiroq qizil"></div>
        <div class=" chiroq sariq"></div>
        <div class=" chiroq yashil"></div>
    </div>
</body>
<!-- (3*80px)+(2*margin:15px)=270px -->
</html>
